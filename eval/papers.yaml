  model: "AUROC (discrimination) and Hosmer-Lemeshow goodness-of-fit (calibration) for each score; RFH score derived by multivariable logistic regression (bilirubin, INR, lactate, A-a gradient, urea, variceal bleeding). No CIs reported for AUROCs."
  design_checklist:
    - "adult ICU patients with cirrhosis (established by clinical/imaging/biopsy criteria; in MIMIC by ICD codes)"
    - "exclude acute liver failure"
    - "exclude post-liver-transplant and postoperative hepatobiliary admissions"
    - "first ICU admission"
    - "MELD and MELD-Na computed from labs on the day of ICU admission (first 24 h)"
    - "outcome = in-hospital mortality (ICU mortality secondary)"
    - "discrimination by AUROC, compared against SOFA (and APACHE/Child-Pugh)"
    - "report calibration (Hosmer-Lemeshow) where possible"
  caveats_vs_mimic: "Single specialist liver ICU in the UK spanning 1989-2012, with very high mortality (52.3%, falling to ~35-42% after 2005) and many variceal-bleeding admissions; MIMIC-IV cirrhosis patients in a general US ICU have lower mortality and different indications (more sepsis/AKI). Identifying cirrhosis by ICD code in MIMIC adds misclassification. AUROCs for MELD ~0.70-0.80 and MELD-Na not better than MELD would be consistent; SOFA usually outperforms MELD."
