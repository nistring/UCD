# LLM endpoint (any OpenAI-compatible /v1/chat/completions API) and one model per agent role.
#
# Environment overrides: UCD_LLM_BASE_URL, UCD_LLM_MODEL (one model for every role),
# UCD_<ROLE>_MODEL / UCD_<ROLE>_BASE_URL, UCD_LLM_THINKING=0|1, UCD_LLM_API_KEY_FILE / UCD_LLM_API_KEY.
# The API key never goes in this file (the client refuses it). Check a setup with: python -m ucd.llm check
#
# Default profile: the KHDP LLM gateway as seen from inside the KHDP platform network (use the host name, not an IP).
# From outside the platform use https://api.khdp.net/v1. A KHDP key is read from ~/.khdp_pat (or KHDP_PAT_FILE /
# KHDP_PAT) and is only ever sent to a *.khdp.net host.
llm:
  base_url: https://internal-api.khdp.net/v1
  model: deepseek-v4-1-flash-ax  # fallback for a role without its own model (chat models only)
  api: auto                     # chat (/chat/completions) | responses (/responses) | auto: chat, else responses
  verify_model: true            # first call checks the id against GET /v1/models
  api_key: none
  max_tokens: 8192
  temperature: 0.2
  context_chars: 32000          # loop history budget in characters (~8k tokens)
  extra_body:                   # Qwen3 thinking off = faster; dropped automatically if the endpoint rejects it
    chat_template_kwargs: {enable_thinking: false}
  # Per role you may also set base_url, temperature, max_tokens and thinking (true/false).
  # Model choice (2026-10-17): one light model for every role, thinking on. deepseek-v4-1-flash-ax scores 39-40 on the
  # Artificial Analysis Intelligence Index with 8-16B active parameters (552B total): the lightest model near the top of
  # the gateway's list (the heaviest, glm-5-3-ax and qwen3-8-max-ax, score 45). That score is measured with reasoning
  # on, and reasoning tokens are cheap on a model this size, so thinking is on; the output budgets leave room for it.
  # Too slow? UCD_PLANNER_THINKING=0 turns it off for the planner only (UCD_LLM_THINKING=0 for every role).
  # To change the model, edit it below, or set UCD_LLM_MODEL (all roles) / UCD_<ROLE>_MODEL (one role).
  # Note: the critic shares the planner's model family; a different family (e.g. qwen3-8-max-ax) gives a more
  # independent review. Check a setup with: python -m ucd.llm check
  roles:
    planner: {model: deepseek-v4-1-flash-ax, max_tokens: 16384, temperature: 0, thinking: true}  # design loop: ~25 calls
    intake:  {model: deepseek-v4-1-flash-ax, max_tokens: 8192, thinking: true}                   # protocol check + questions
    critic:  {model: deepseek-v4-1-flash-ax, max_tokens: 8192, thinking: true}                   # clinical critic + waivers
