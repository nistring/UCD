# LLM endpoint (any OpenAI-compatible /v1/chat/completions API) and one model per agent role.
#
# Environment overrides: UCD_LLM_BASE_URL, UCD_LLM_MODEL (one model for every role),
# UCD_<ROLE>_MODEL / UCD_<ROLE>_BASE_URL, UCD_LLM_THINKING=0|1, UCD_LLM_API_KEY_FILE / UCD_LLM_API_KEY.
# The API key never goes in this file (the client refuses it). Check a setup with: python -m ucd.llm check
#
# Default profile: the KHDP LLM gateway as seen from inside the KHDP platform network (use the host name, not an IP).
# From outside the platform use https://api.khdp.net/v1. A KHDP key is read from ~/.khdp_pat (or KHDP_PAT_FILE /
# KHDP_PAT) and is only ever sent to a *.khdp.net host.
llm:
  base_url: https://internal-api.khdp.net/v1
  model: deepseek-v4-1-flash-ax  # fallback for a role without its own model (chat models only)
  api: auto                     # chat (/chat/completions) | responses (/responses) | auto: chat, else responses
  verify_model: true            # first call checks the id against GET /v1/models
  api_key: none
  max_tokens: 8192
  temperature: 0.2
  context_chars: 32000          # loop history budget in characters (~8k tokens)
  extra_body:                   # Qwen3 thinking off = faster; dropped automatically if the endpoint rejects it
    chat_template_kwargs: {enable_thinking: false}
  # Per role you may also set base_url, temperature, max_tokens and thinking (true/false).
  # Model choice (2026-10-17): by public benchmark results and burden only, not by results on this project.
  #   planner  glm-5-3-ax          Artificial Analysis Intelligence Index 45 (tied best of the gateway models),
  #                                40B active of 753B, ~74 tok/s, $4.40 / 1M output; ~25 calls per run, so speed counts
  #   intake   deepseek-v4-1-flash-ax  index 39-40 at 8-16B active (552B total): the lightest; a few short calls
  #   critic   qwen3-8-max-ax      index 45, GPQA Diamond 92.6; slow (35 tok/s) and dear ($6 / 1M output), but at most
  #                                a few calls per run; a third model family, so its review is independent of the planner
  # Not chosen: deepseek-v4-pro-ax (index 36 with 49B active: outscored by the lighter V4.1 Flash), qwen3-8-flash-next-ax
  # (index reports disagree; same family as the critic). Scores are vendor or Artificial Analysis figures in reasoning
  # mode; the gateway's "-ax" deployments may differ. Thinking: on for the critic (few calls), off for planner and intake.
  # Each family has its own thinking switch (ucd/llm.py thinking_switch): GLM ignores chat_template_kwargs and writes its
  # reasoning into the reply (E-77), so it gets thinking.type; it still reasons internally, hence the planner's 12k budget.
  roles:
    planner: {model: glm-5-3-ax, max_tokens: 12288, temperature: 0}            # design loop: many turns; 0 = reproducible
    intake:  {model: deepseek-v4-1-flash-ax, max_tokens: 3072}                 # protocol check + questions
    critic:  {model: qwen3-8-max-ax, max_tokens: 8192, thinking: true}         # clinical critic + waiver judge
