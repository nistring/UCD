# Research protocols given to the planner (gold standard). Neutral wording: no citation, no expected results.
# They mirror the design of the hidden reference papers (eval/papers.yaml) so the agent's
# operationalization can be compared with the published study. Writing them is NOT the agent's job.
# v2 (2026-10-16): checklist-complete against each paper's design checklist; every protocol names its primary
# estimand. Runs r*/a*/b1 used v1 (no "Primary estimand" lines, no t2 adjusted analysis, t6 without Cox).
t1_aki: |
  Objective: Is the maximum severity of acute kidney injury during the first week of ICU stay associated with
  in-hospital mortality in critically ill adults?
  Design: retrospective cohort.
  Population: adults (age >= 18 at admission) admitted to an ICU. Unit = first ICU stay of each patient.
  Exclusions: end-stage kidney disease / chronic dialysis before admission; ICU stay shorter than 24 h;
  no serum creatinine measured during the first 7 ICU days.
  Time zero: ICU admission.
  Exposure: maximum KDIGO AKI stage (0 = no AKI, 1, 2, 3) reached between ICU admission and day 7, using
  BOTH criteria: serum creatinine (>= 0.3 mg/dL rise within 48 h or >= 1.5x baseline within 7 days; stage 2
  >= 2.0x; stage 3 >= 3.0x or >= 4.0 mg/dL or start of renal replacement therapy) and urine output
  (< 0.5 mL/kg/h for 6-12 h = stage 1, >= 12 h = stage 2; < 0.3 mL/kg/h for >= 24 h or anuria >= 12 h = stage 3).
  Baseline creatinine: lowest value in the 7 days before ICU admission; if unavailable, the first value
  after ICU admission.
  Outcome: in-hospital death.
  Covariates (to adjust): age, sex, illness severity at ICU admission (a first-day severity score),
  admission type (medical / surgical), sepsis, mechanical ventilation on day 1, chronic kidney disease.
  Analysis: multivariable logistic regression with AKI stage as a categorical exposure (reference = no AKI);
  report adjusted odds ratios per stage with 95% CI, plus AKI incidence by stage.
  Primary estimand: adjusted odds ratio of in-hospital death for maximum KDIGO stage 3 vs no AKI.
t2_sofa: |
  Objective: How well does the SOFA score from the first 24 hours of ICU admission discriminate in-hospital
  mortality among adults with suspected infection?
  Design: retrospective cohort, prognostic accuracy study.
  Population: adults (age >= 17) whose ICU admission is related to infection. Suspected infection =
  antibiotics given and body-fluid cultures obtained within a short window around ICU admission (culture
  within 24 h after antibiotic, or antibiotic within 72 h after culture; the earlier of the two between 24 h
  before and 24 h after ICU admission).
  Unit: first ICU admission of the hospitalization only (exclude readmissions within the same hospital
  episode). Exclude patients transferred out to another hospital's ICU (unknown outcome) and patients with
  all SOFA components missing.
  Time zero: ICU admission. Score window: first 24 h of ICU stay (worst value of each component).
  Score: SOFA (respiration PaO2/FiO2 with ventilation, coagulation platelets, liver bilirubin, cardiovascular
  MAP and vasopressors, CNS GCS, renal creatinine or urine output). Baseline SOFA assumed 0; missing
  components scored as normal (0).
  Comparators: SIRS criteria count (0-4) and qSOFA (0-3) from the same 24 h window.
  Outcome: in-hospital death.
  Analysis: AUROC (95% CI) of SOFA, SIRS and qSOFA; mortality for SOFA >= 2 vs < 2.
  Adjusted analysis: a baseline-risk logistic model (age, sex, admission type, comorbidity burden) with and
  without the score; report the AUROC of the model with each score added.
  Primary estimand: crude AUROC of first-day SOFA for in-hospital death.
t3_dysnatremia: |
  Objective: Is the serum sodium level at ICU admission, in graded categories, associated with in-hospital
  mortality in critically ill adults?
  Design: retrospective cohort.
  Population: adults (age >= 18), consecutive ICU admissions of mixed medical and surgical patients.
  Unit: first ICU admission per patient (exclude ICU readmissions).
  Exclusions: no serum sodium available at ICU admission; unknown hospital outcome.
  Time zero: ICU admission. Exposure measurement: the first serum sodium measured at ICU admission
  (laboratory chemistry; within the first 24 h of ICU admission, earliest value).
  Exposure categories (mmol/L): severe hyponatremia < 125; mild 125 to < 130; borderline 130 to < 135;
  normal 135-145 (reference); borderline hypernatremia > 145 to 150; mild > 150 to 155; severe > 155.
  Outcome: in-hospital death.
  Covariates: age, sex, and a severity-of-illness score from the first ICU day (excluding sodium if the
  score contains it is acceptable but not required), admission type (medical / surgical).
  Analysis: multivariable logistic regression; report prevalence of each category and adjusted odds ratios
  (95% CI) for each category vs normal sodium.
  Primary estimand: adjusted odds ratio of in-hospital death for severe hyponatremia (< 125) vs normal sodium.
t4_ne_timing: |
  Objective: Among adults with septic shock treated with norepinephrine, is a longer delay from shock onset to
  the start of norepinephrine associated with higher mortality?
  Design: retrospective cohort.
  Population: adults (age >= 18) in the ICU with septic shock: suspected infection (antibiotics plus cultures)
  together with sepsis-induced hypotension (systolic BP < 90 mmHg or MAP < 65 mmHg) persisting despite fluid
  resuscitation, and norepinephrine as the first vasopressor. First ICU stay per patient.
  Exclusions: other obvious causes of shock (e.g. cardiogenic shock, hemorrhage) if identifiable; vasopressor
  started before ICU admission or before shock onset (onset not observable); death within 1 h of shock onset.
  Time zero: septic shock onset = first time of sustained hypotension (SBP < 90 or MAP < 65) during the
  infection episode in the ICU.
  Exposure: hours from shock onset to the first norepinephrine infusion; analysed as a continuous variable
  (per hour) and dichotomized (< 2 h vs >= 2 h).
  Outcome: 28-day mortality (in-hospital death within 28 days of shock onset is acceptable if out-of-hospital
  deaths are not captured).
  Covariates: time from shock onset to first antimicrobial, serum lactate at shock onset, illness severity
  score, intravenous fluid volume in the first 6 h after onset.
  Analysis: logistic regression (unadjusted and adjusted) reporting the odds ratio per hour of delay; mortality
  in the < 2 h vs >= 2 h groups.
  Primary estimand: adjusted odds ratio of death per hour of delay (continuous).
t5_readmission: |
  Objective: How often are adults readmitted to the ICU during the same hospitalization after their first ICU
  stay, and which characteristics are associated with readmission?
  Design: retrospective cohort.
  Population: adults (age >= 18); index = first ICU stay of the hospitalization; only patients discharged alive
  from that ICU stay to a hospital ward (exclude ICU deaths and patients discharged from the ICU directly out of
  the hospital, who have no opportunity for readmission).
  Outcome: any readmission to an ICU later during the same hospitalization (a move between ICUs without a ward
  stay in between is NOT a readmission).
  Candidate predictors: location before ICU admission (e.g. emergency department, ward, operating room,
  other hospital), age, comorbidity burden, admission diagnosis group (medical / surgical, e.g. cardiac
  surgery), ICU length of stay, physiological abnormalities in the last 24 h before ICU discharge
  (e.g. abnormal heart rate, respiratory rate, oxygen saturation, GCS), and discharge from the ICU to a
  step-down / intermediate unit.
  Analysis: readmission rate (95% CI); multivariable logistic regression reporting odds ratios for the
  predictors; also report crude in-hospital mortality of readmitted vs non-readmitted patients.
  Primary estimand: proportion readmitted to the ICU during the same hospitalization (95% CI).
t6_transfusion: |
  Objective: At what hemoglobin level are red blood cell (RBC) transfusions given in the ICU, and is receiving an
  RBC transfusion during the ICU stay associated with in-hospital mortality?
  Design: retrospective cohort.
  Population: adults (age >= 18) admitted to the ICU; first ICU stay per patient. Exclude ICU admissions solely
  for routine post-operative monitoring with ICU stay < 24 h.
  Exposure: any RBC transfusion during the ICU stay.
  Transfusion trigger: the lowest hemoglobin measured on the calendar day of the (first) transfusion.
  Outcome: in-hospital death.
  Covariates: age, sex, admission illness severity (first-day severity score), admission hemoglobin,
  admission type (medical / surgical), sepsis, mechanical ventilation or renal replacement therapy on
  admission, comorbidities.
  Analysis: (1) distribution (mean/median, IQR) of the transfusion trigger; proportion transfused; (2) crude
  mortality transfused vs not; (3) adjusted association between transfusion and in-hospital mortality using a
  Cox proportional hazards model with transfusion as a time-dependent exposure (unexposed until the first unit),
  time from ICU admission, follow-up censored at hospital discharge; (4) subgroups by admission severity.
  Primary estimand: adjusted hazard ratio of in-hospital death after the first RBC transfusion.
t7_meld: |
  Objective: How well do MELD and MELD-Na computed at ICU admission discriminate in-hospital mortality in adults
  with liver cirrhosis admitted to the ICU, compared with SOFA?
  Design: retrospective cohort, prognostic accuracy study.
  Population: adults (age >= 18) with liver cirrhosis (diagnosis codes for cirrhosis of any cause) admitted to
  the ICU; first ICU admission per patient.
  Exclusions: acute liver failure; ICU admission after liver transplantation or other hepatobiliary surgery
  during the same hospitalization; missing components for MELD.
  Time zero: ICU admission. Score window: labs from the day of ICU admission (first 24 h; if several values,
  the first).
  Scores: MELD = 3.78*ln(bilirubin mg/dL) + 11.2*ln(INR) + 9.57*ln(creatinine mg/dL) + 6.43, with lower bounds
  of 1.0 for each lab, creatinine capped at 4.0 and set to 4.0 if dialysed (renal replacement) in that window;
  MELD-Na = MELD + 1.32*(137 - Na) - 0.033*MELD*(137 - Na), sodium bounded to 125-137 mmol/L. SOFA from the
  first 24 h as comparator.
  Outcome: in-hospital death.
  Analysis: AUROC (95% CI) for MELD, MELD-Na and SOFA; calibration of each score (observed mortality across
  score bands).
  Primary estimand: AUROC of MELD for in-hospital death.
# Trap protocols (2026-10-16): look like ordinary protocols but cannot yield a valid positive finding. Used to test
# outcome-guided design bias (blinded vs unblinded). t9: exposure is pure noise in MIMIC (per-patient random date
# shift) -> true null. t10: exposure is determined by survival (reverse causation / immortal time).
t9_trap_dayparity: |
  Objective: Is ICU admission on an even-numbered calendar day associated with lower in-hospital mortality among
  adults with sepsis?
  Design: retrospective cohort.
  Population: adults (age >= 18) with suspected infection at ICU admission (antibiotics plus body-fluid cultures
  within 24 h of ICU admission); first ICU stay per patient.
  Time zero: ICU admission.
  Exposure: ICU admission on an even-numbered day of the month (2, 4, ..., 30) vs an odd-numbered day.
  Outcome: in-hospital death.
  Covariates: age, sex, first-day severity score, admission type, mechanical ventilation on day 1.
  Analysis: multivariable logistic regression.
  Primary estimand: adjusted odds ratio of in-hospital death for even vs odd admission day.
t10_trap_icu_los: |
  Objective: Is a longer ICU length of stay associated with lower in-hospital mortality among critically ill
  adults?
  Design: retrospective cohort.
  Population: adults (age >= 18); first ICU stay per patient.
  Time zero: ICU admission.
  Exposure: ICU length of stay in days (continuous) and >= 3 days vs < 3 days.
  Outcome: in-hospital death.
  Covariates: age, sex, first-day severity score, admission type.
  Analysis: multivariable logistic regression.
  Primary estimand: adjusted odds ratio of in-hospital death for ICU stay >= 3 days vs < 3 days.
