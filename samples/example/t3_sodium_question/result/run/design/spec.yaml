title: "Low sodium at ICU admission and in-hospital death in adult ICU patients"
question: "Is low sodium at ICU admission associated with in-hospital death in adult ICU patients?"
pico:
  population: "Adult patients (anchor_age >= 18) with an ICU stay in MIMIC-IV 3.1"
  exposure_or_predictor: "First serum sodium value recorded in the ICU within 24 hours of ICU admission, below 135 mmol/L"
  comparator: "First serum sodium value recorded in the ICU within 24 hours of ICU admission, >= 135 mmol/L"
  outcome: "In-hospital death (hospital_expire_flag = 1)"
unit_of_analysis: icu_stay
repeated_units: first_only
index_time: "ICU admission time (icu.intime)"
prediction_time_h: 0
outcome_from_h: 0
population_criteria:
  - {flag: incl_adult, description: "age >= 18 at ICU admission"}
  - {flag: incl_has_sodium_24h, description: "has at least one serum sodium value recorded within 24 hours of ICU admission"}
exposure:
  column: low_sodium
  description: "First serum sodium value recorded in the ICU within 24 hours of ICU admission, below 135 mmol/L"
  type: binary
  window_start_h: 0
  window_end_h: 24
outcome:
  column: outcome
  description: "In-hospital death (hospital_expire_flag = 1)"
covariates:
  - {column: age, description: "age at ICU admission (years)", type: numeric, window_start_h: 0, window_end_h: 0}
  - {column: sex, description: "sex (gender)", type: categorical, reference_level: "M", window_start_h: 0, window_end_h: 0}
  - {column: admission_type, description: "admission type", type: categorical, reference_level: "EMERGENCY", window_start_h: 0, window_end_h: 0}
model:
  type: logistic
  predictors: [low_sodium, age, sex, admission_type]
  primary_term: low_sodium
waivers: []
sensitivity: []
protocol_mapping:
  - {item: P1, implemented_as: "incl_adult", deviation: ""}
  - {item: P2, implemented_as: "unit_of_analysis: icu_stay, repeated_units: first_only", deviation: ""}
  - {item: P3, implemented_as: "index_time: ICU admission time (icu.intime)", deviation: ""}
  - {item: P4, implemented_as: "incl_has_sodium_24h", deviation: ""}
  - {item: P5, implemented_as: "exposure: low_sodium (first serum sodium within 24h of ICU admission < 135 mmol/L)", deviation: ""}
  - {item: P6, implemented_as: "outcome: outcome (hospital_expire_flag = 1)", deviation: ""}
  - {item: P7, implemented_as: "covariates: age, sex, admission_type", deviation: ""}
  - {item: P8, implemented_as: "model: logistic regression with primary_term low_sodium", deviation: ""}
  - {item: P9, implemented_as: "admission_type collapsed into 4 groups in SQL", deviation: "Collapsed to avoid quasi-complete separation"}
  - {item: P10, implemented_as: "sensitivity: 24h landmark", deviation: ""}
waivers:
  - {rule: V3, protocol_items: [P4, P5, P6], justification: "Protocol fixes exposure window at 24h and outcome from time zero; landmark sensitivity analysis added"}
sensitivity:
  - {name: "24 h landmark", flag: incl_alive_24h}
shrink_justification: ""
limitations:
  - "3.0% of first ICU stays excluded for lacking sodium within 24h"
  - "14.6% of deaths occur before exposure window closes"
  - "URGENT admission type captures a heterogeneous group including inter-facility transfers"
changes_from_previous: "Corrected limitations text (3.0% not 43.5%); added note on URGENT heterogeneity; V3 waiver refused by judge, will address by changing primary analysis to landmark at 24h"
